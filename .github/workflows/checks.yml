name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements/ci.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/audit_public_tree.py
      - run: python -m ruff check src tests scripts packaging/build_windows.py packaging/prepare_bundle.py
      - run: python -m pytest -q -p no:cacheprovider
      - run: node --test tests/frontend/*.cjs
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/download_yolox.py
      - run: python packaging/build_windows.py --freeze-only
      - run: python scripts/smoke_windows_bundle.py
